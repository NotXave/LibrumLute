# Runs all tests
name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - dev/develop
      - main
  pull_request:
    branches:
      - dev/develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_linux:
    name: run on linux
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install tools
        # libjpeg-dev: MuPDF builds against the system libjpeg on Linux
        # (CMAKE passes USE_SYSTEM_LIBJPEG=yes), which matches the Qt build.
        # libgl1-mesa-dev is required to link against the Qt GUI modules.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libjpeg-dev libgl1-mesa-dev

      - name: Install python dependencies
        # mupdfwrap.py needs libclang to generate the C++ wrapper (NO_VENV).
        run: python3 -m pip install libclang

      - name: Build
        run: |
          cmake -GNinja -B build-Release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DNO_VENV=ON .
          cmake --build build-Release

      - name: Run tests
        run: ctest --test-dir build-Release --output-on-failure



  test_windows:
    name: run on windows
    # windows-latest ships Visual Studio 18 (2026), which MuPDF's wdev.py
    # cannot locate (it only globs "Microsoft Visual Studio\2*"); pin the
    # VS2022 image that --vs-upgrade 1 and the Qt msvc2022 build expect.
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install python dependencies
        # mupdfwrap.py needs libclang to generate the C++ wrapper (NO_VENV).
        run: python -m pip install libclang

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja + MSVC mirrors the development build; the Visual Studio
      # generator races its WINDOWS_EXPORT_ALL_SYMBOLS __create_def
      # pre-link step against parallel compiles (MSB3073).
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DNO_VENV=ON .
          cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
