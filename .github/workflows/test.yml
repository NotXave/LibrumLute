# Runs all tests
name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - dev/develop
      - main
  pull_request:
    branches:
      - dev/develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_linux:
    name: run on linux
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install tools
        # libjpeg-dev: MuPDF builds against the system libjpeg on Linux
        # (CMAKE passes USE_SYSTEM_LIBJPEG=yes), which matches the Qt build.
        # libgl1-mesa-dev is required to link against the Qt GUI modules.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libjpeg-dev libgl1-mesa-dev

      - name: Build
        run: |
          cmake -GNinja -B build-Release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DNO_VENV=ON .
          cmake --build build-Release

      - name: Run tests
        run: ctest --test-dir build-Release --output-on-failure



  test_windows:
    name: run on windows
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Build
        run: |
          cmake -B build -DBUILD_TESTS=ON -DNO_VENV=ON .
          cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
